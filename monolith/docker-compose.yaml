version: "3.5"

services:
  postgres:
    image: postgres
    container_name: go-wallet-postgres
    environment:
      POSTGRES_USER: waves2k
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: go_wallet
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    restart: always

volumes:
  postgres_data: