version: "3.5"

services:
  postgres:
    image: postgres
    container_name: go-wallet-postgres
    environment:
      POSTGRES_USER: waves2k
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: go_wallet
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    restart: always
    networks:
      - pg_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: go-wallet-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpass
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - pg_network


networks:
  pg_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data: